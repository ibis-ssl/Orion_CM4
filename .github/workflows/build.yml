name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: build & test
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: 依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-all-dev

      # cm4/build.sh は setup.sh / update.sh と同じ唯一のビルド定義。
      # 末尾で次を実行する:
      #   - robot_packet_layout_test.out: crane 版正本からのパケットレイアウトのドリフト検出
      #   - test_position_controller.out: 位置制御則の単体テスト
      #   - test_packet_codec.py: Python 側のオフセット表が C++ の正本と一致するか
      #   - test_cm4_sim.py: cm4_sim の結合スモークテスト
      #   - test_forward_ai_cmd_v2.py: 実機ブリッジの結合スモークテスト
      #     (--debug + pty で動かすので実機 UART も STM32 も不要)
      - name: ビルドとテスト
        run: ./cm4/build.sh

      # test_main_uart_stability.py は実機 UART が必要なので CI からは除外する。
      - name: Python 単体テスト
        run: |
          cd cm4/firmware
          python3 -m unittest test_fw_version_reader test_all_can_updater -v
