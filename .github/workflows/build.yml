name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: build & test
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: 依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-all-dev

      # cm4/build.sh は setup.sh / update.sh と同じ唯一のビルド定義。
      # 末尾で robot_packet_layout_test.out を実行し、crane 版正本からの
      # パケットレイアウトのドリフトを検出する。
      - name: ビルドとパケットレイアウト検査
        run: ./cm4/build.sh

      # test_main_uart_stability.py は実機 UART が必要なので CI からは除外する。
      - name: Python 単体テスト
        run: |
          cd cm4/firmware
          python3 -m unittest test_fw_version_reader test_all_can_updater -v
