# cm4_sim の Docker イメージをビルドして ghcr へ push する。
# crane 側の docker/scenario/docker-compose.yaml が
# ghcr.io/ibis-ssl/orion-cm4-sim:latest を参照している。
#
# pull_request では push せずビルドだけ行う。Dockerfile の破損を
# マージ前に捕まえるため。
#
# 【初回だけ手作業が要る】ghcr のパッケージは最初の push で **private** として
# 作られる。crane の compose はログイン無しの素の image: で pull するので、
# この workflow が緑になっても public にするまで unauthorized で失敗する。
# GitHub の Packages 設定で orion-cm4-sim を public にすること。
# 同じ組織の robot-manager と framework-simulatorcli は既に public になっている
# （匿名 pull が通ることを確認済み）ので、同じ手順で揃う。
name: cm4-sim docker

on:
  push:
    branches:
      - main
    paths:
      - 'cm4/**'
      - '.github/workflows/cm4-sim-docker.yml'
  pull_request:
    paths:
      - 'cm4/**'
      - '.github/workflows/cm4-sim-docker.yml'
  workflow_dispatch:

jobs:
  build:
    name: build cm4-sim image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context は cm4/ のみ。build.sh・bridge・control がすべてここにある。
      #
      # load: true でローカルの image store にも入れる。setup-buildx-action は
      # docker-container ドライバを既定にするので、これが無いと後段の docker run が
      # 「image not found」で落ちる。ビルドは 1 回で済む。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cm4
          file: ./cm4/Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/orion-cm4-sim:latest
            ghcr.io/${{ github.repository_owner }}/orion-cm4-sim:${{ github.sha }}
          cache-from: type=gha,scope=cm4-sim
          cache-to: type=gha,mode=max,scope=cm4-sim

      # compose 側の契約 (entrypoint: tini / command: cm4_sim) が満たされているか、
      # 直前に load したイメージを実際に動かして確かめる。
      - name: Verify compose contract
        run: |
          docker run --rm --entrypoint tini \
            ghcr.io/${{ github.repository_owner }}/orion-cm4-sim:latest -- cm4_sim --help
