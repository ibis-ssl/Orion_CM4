[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-cm4"
version = "0.1.0"
description = "Host and CM4 control utilities for Orion_CM4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "flask",
    "numpy",
    "opencv-python",
    "pillow",
    "pyside6",
    "rerun-sdk",
    "requests",
    "uvicorn",
]

[project.scripts]
cm4-control = "host.cm4_control:main"
cm4-camera = "host.cm4_camera:main"
host-launcher = "host.host_lancher:main"
cam-viewer = "host.cam_viewer:main"
robot-feedback-receiver = "host.robot_feedback_receiver:main"
robot-feedback-viewer = "host.robot_feedback_viewer:main"
robot-feedback-rerun = "host.robot_feedback_rerun:main"

[tool.setuptools.packages.find]
include = ["host*", "cm4*"]

[tool.setuptools.package-data]
"cm4.camera" = ["default_hsv_config.json"]
